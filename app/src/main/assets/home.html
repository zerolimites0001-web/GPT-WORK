<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GPT-WORK • Início</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,Segoe UI,Roboto}
body{background:linear-gradient(180deg,#0F1114 0%,#171A22 100%);color:#E8EAED;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 14px}
.logo{font-size:30px;font-weight:900;letter-spacing:-1px;background:linear-gradient(90deg,#7C9CFF,#9EE493);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:18px 0 6px}
.sub{color:#9AA0A6;font-size:13px;margin-bottom:16px}
.searchBox{width:100%;max-width:580px;background:#1E2026;border:1px solid #2A2E38;border-radius:20px;display:flex;align-items:center;padding:12px 16px;gap:10px;box-shadow:0 12px 32px rgba(0,0,0,.4)}
.searchBox input{flex:1;background:transparent;border:0;outline:0;color:#fff;font-size:16px}
.searchBox button{background:#7C9CFF;color:#0F1114;border:0;border-radius:12px;padding:10px 18px;font-weight:800;cursor:pointer}
.actions{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap;justify-content:center}
.actions button{background:#1E2026;border:1px solid #2A2E38;color:#E8EAED;border-radius:999px;padding:8px 14px;font-size:12px;cursor:pointer}
.grid{width:100%;max-width:580px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}
.tile{background:#1E2026;border:1px solid #2A2E38;border-radius:18px;padding:16px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:#E8EAED;transition:transform .12s}
.tile:active{transform:scale(.97)} .tile span{font-size:11px;color:#9AA0A6} .tile b{font-size:22px}
.footer{margin-top:auto;padding:16px;color:#7A8591;font-size:11px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.badge{background:#1E2026;border:1px solid #2A2E38;border-radius:999px;padding:6px 10px}
</style>
</head><body>
<div class="logo">GPT-WORK</div>
<div class="sub">Browser 1.0 • Rápido • 3D • IA</div>
<div class="searchBox">
  <span>🔍</span>
  <input id="q" placeholder="Pesquisar ou digitar endereço" onkeydown="if(event.key==='Enter')go()">
  <button onclick="go()">Ir</button>
</div>
<div class="actions">
  <button onclick="location.href='https://chat.openai.com'">🤖 ChatGPT</button>
  <button onclick="location.href='https://www.youtube.com'">▶️ YouTube</button>
  <button onclick="location.href='https://github.com'">⭐ GitHub</button>
  <button onclick="history.back()">◀ Voltar</button>
</div>
<div class="grid">
  <a class="tile" href="https://www.google.com"><b>🔍</b><span>Google</span></a>
  <a class="tile" href="https://www.youtube.com"><b>▶️</b><span>YouTube</span></a>
  <a class="tile" href="https://github.com"><b>⭐</b><span>GitHub</span></a>
  <a class="tile" href="https://duckduckgo.com"><b>🦆</b><span>DuckGo</span></a>
  <a class="tile" href="https://www.wikipedia.org"><b>📚</b><span>Wiki</span></a>
  <a class="tile" href="https://chat.openai.com"><b>🤖</b><span>IA</span></a>
  <a class="tile" href="https://webglsamples.org"><b>🎮</b><span>3D Teste</span></a>
  <a class="tile" href="https://x.com"><b>𝕏</b><span>X</span></a>
</div>
<div class="footer"><span class="badge">⚡ Acelerado</span><span class="badge">🎮 3D GPU</span><span class="badge">🤖 IA Ready</span><span class="badge">🛡️ Anti-crash</span></div>
<script>
function go(){
  var v=document.getElementById('q').value.trim();
  if(!v) return;
  if(v.indexOf('.')>-1 && v.indexOf(' ')==-1 && !v.startsWith('http')) v='https://'+v;
  else if(!v.startsWith('http')) v='https://www.google.com/search?q='+encodeURIComponent(v);
  location.href=v;
}
</script>
</body></html>
